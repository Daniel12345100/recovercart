client_id = "5253e64ce68b882f04a6c4fef8e327cf"
name = "RecoverCart"
application_url = "https://structure-diamonds-session-cathedral.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_orders,write_checkouts"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://structure-diamonds-session-cathedral.trycloudflare.com/auth/callback",
  "https://structure-diamonds-session-cathedral.trycloudflare.com/auth/shopify/callback",
  "https://structure-diamonds-session-cathedral.trycloudflare.com/api/auth/callback"
]
